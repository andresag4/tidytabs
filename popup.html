<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>tidytabs</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <section>
    <h2>Triage</h2>
    <button data-action="tidy">✨ Tidy now</button>
    <button data-action="tidy-merge">⤵ Tidy + merge</button>
    <button data-action="ticket-triage">🎫 By ticket ID</button>
    <button data-action="cleanup">🧹 Clean up</button>
  </section>

  <section>
    <h2>Group</h2>
    <button data-action="copy-group-urls">📋 Copy all URLs</button>
    <button data-action="copy-group-domain-urls">🌐 Copy all domain URLs</button>
    <button data-action="reload-group">🔄 Force reload all tabs</button>
  </section>

  <section>
    <h2>Current Domain</h2>
    <button data-action="copy-urls">📋 Copy all URLs</button>
    <button data-action="reload-domain">🔄 Force reload all tabs</button>
    <button data-action="reload-window">🔁 Force reload window</button>
  </section>

  <section>
    <h2>Other</h2>
    <button data-action="toggle-passwords">👁 Toggle password visibility</button>
  </section>

  <script type="module" src="src/popup.js"></script>
</body>
</html>
